name: Publicar API (Cloudflare Worker)

# Manual on purpose: the API and its database migrations are deployed only
# when you decide, after the checks below pass.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Aplicar migrações pendentes do D1 antes do deploy
        type: boolean
        default: false
      allow_destructive:
        description: Permitir migrações potencialmente destrutivas (faça backup antes!)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment to add a manual approval step.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - name: Verificar migrações pendentes
        run: node scripts/check-migrations.mjs
        env:
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
      - name: Aplicar migrações (D1 remoto)
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy do Worker
        run: npx wrangler deploy
